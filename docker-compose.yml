# Usage (see README):
#   cp .env.example .env              # then set POSTGRES_PASSWORD
#   ./pgo keygen                      # put the key into .env as PAPERLESS_GO_SECRET_KEY
#   ./pgo migrate                     # wrapper around `docker compose run`
#   docker compose up -d web          # web UI on http://localhost:8080 (image built by ./pgo)
#
# Both images are multi-arch (amd64 and arm64, e.g. Apple Silicon).

name: paperless-go

services:
  postgres:
    # Debian, not Alpine: full-text ranking is about four times slower on
    # musl. Changing the image of an existing database changes how it sorts
    # text; ./pgo migrate then rebuilds the affected indexes.
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Only read when a new database is created: PostgreSQL's own locale
      # (code point order), so no future image or C library can change how
      # text sorts. An existing database keeps the locale it was created with.
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8
    volumes:
      # PostgreSQL 18+ images keep data in a versioned subdirectory
      # (/var/lib/postgresql/<major>/docker), so the volume is mounted one
      # level up. Major upgrades need pg_upgrade or dump/restore.
      - pgdata:/var/lib/postgresql
    ports:
      # Only reachable from this machine; remove if not needed.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web server (UI and JSON API). Reachable from this machine only unless
  # WEB_BIND is set; see docs/reference/security.md.
  # Start or update with: ./pgo migrate && docker compose up -d web
  web:
    build:
      context: .
      args:
        VERSION: ${PAPERLESS_GO_VERSION:-dev} # set by ./pgo from `git describe`
    image: ${PAPERLESS_GO_IMAGE:-paperless-go:local}
    restart: unless-stopped
    command: ["serve", "--listen", ":8080"]
    # No process in the container may gain privileges (setuid binaries).
    security_opt: ["no-new-privileges:true"]
    # Time to stop the OCR tools and give running jobs back (up to 10 s
    # each) before Docker kills the server.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
        # Restart when the database container is recreated (a new image),
        # so the start-up checks run again: serve refuses to run on text
        # indexes built under another locale until ./pgo migrate has
        # rebuilt them.
        restart: true
    environment:
      PAPERLESS_GO_DATABASE_URL: postgres://paperless:${POSTGRES_PASSWORD}@postgres:5432/paperless?sslmode=disable
      PAPERLESS_GO_LOG_LEVEL: ${PAPERLESS_GO_LOG_LEVEL:-info}
      PAPERLESS_GO_ALLOWED_HOSTS: ${PAPERLESS_GO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      PAPERLESS_GO_TRUSTED_PROXIES: ${PAPERLESS_GO_TRUSTED_PROXIES:-}
      # Required: serve refuses to start without it (generate with ./pgo keygen).
      PAPERLESS_GO_SECRET_KEY: ${PAPERLESS_GO_SECRET_KEY:-}
      PAPERLESS_GO_REQUIRE_2FA: ${PAPERLESS_GO_REQUIRE_2FA:-false}
      # Turns passkeys on; the address users open, like https://docs.example.ts.net.
      PAPERLESS_GO_PUBLIC_URL: ${PAPERLESS_GO_PUBLIC_URL:-}
      PAPERLESS_GO_MAX_UPLOAD_SIZE: ${PAPERLESS_GO_MAX_UPLOAD_SIZE:-}
      PAPERLESS_GO_OCR_WORKERS: ${PAPERLESS_GO_OCR_WORKERS:-1}
      PAPERLESS_GO_OCR_LANGUAGES: ${PAPERLESS_GO_OCR_LANGUAGES:-deu+eng}
      PAPERLESS_GO_OCR_TIMEOUT: ${PAPERLESS_GO_OCR_TIMEOUT:-30m}
      # The consume folder: files put into consume/<user>/ are imported for
      # that user. PAPERLESS_GO_CONSUME_DIR= (empty) in .env turns it off.
      PAPERLESS_GO_CONSUME_DIR: ${PAPERLESS_GO_CONSUME_DIR-/consume}
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${CONSUME_DIR:-./consume}:/consume
    ports:
      # WEB_BIND=0.0.0.0 (or a LAN or Tailscale address) opens it to a network.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"

  paperless-go:
    build:
      context: .
      args:
        VERSION: ${PAPERLESS_GO_VERSION:-dev} # set by ./pgo from `git describe`
    image: ${PAPERLESS_GO_IMAGE:-paperless-go:local}
    # One-shot CLI: not started by `docker compose up`, use `docker compose run`.
    profiles: ["cli"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAPERLESS_GO_DATABASE_URL: postgres://paperless:${POSTGRES_PASSWORD}@postgres:5432/paperless?sslmode=disable
      PAPERLESS_GO_LOG_LEVEL: ${PAPERLESS_GO_LOG_LEVEL:-info}
      PAPERLESS_GO_MAX_UPLOAD_SIZE: ${PAPERLESS_GO_MAX_UPLOAD_SIZE:-}
      PAPERLESS_GO_OCR_WORKERS: ${PAPERLESS_GO_OCR_WORKERS:-1}
      PAPERLESS_GO_OCR_LANGUAGES: ${PAPERLESS_GO_OCR_LANGUAGES:-deu+eng}
      PAPERLESS_GO_OCR_TIMEOUT: ${PAPERLESS_GO_OCR_TIMEOUT:-30m}
      # For prepare-data (./pgo migrate), which creates the consume folder.
      PAPERLESS_GO_CONSUME_DIR: ${PAPERLESS_GO_CONSUME_DIR-/consume}
    volumes:
      # Document files. A bind mount keeps them visible on the host for backups.
      - ${DATA_DIR:-./data}:/data
      - ${CONSUME_DIR:-./consume}:/consume

volumes:
  pgdata:
