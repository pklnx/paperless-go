version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
  exclusions:
    generated: strict
    paths:
      - internal/store/db
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [bodyclose, gosec, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pklnx/paperless-go
