# The lockfile was made with these overrides.
overrides:
  "@napi-rs/canvas": "-"
# Install scripts of dependencies. The Carbon and IBM Plex packages run
# `ibmtelemetry` (@ibm/telemetry-js) after install, which reports usage to
# IBM: never allowed. strictDepBuilds fails the install when a new dependency
# brings a build script that is not listed here, so it gets reviewed first.
# IBM_TELEMETRY_DISABLED=true (CI, Dockerfile, Makefile) is a second guard.
allowBuilds:
  "@carbon/colors": false
  "@carbon/feature-flags": false
  "@carbon/grid": false
  "@carbon/icon-helpers": false
  "@carbon/icons-react": false
  "@carbon/layout": false
  "@carbon/motion": false
  "@carbon/react": false
  "@carbon/styles": false
  "@carbon/themes": false
  "@carbon/type": false
  "@carbon/utilities": false
  "@ibm/plex": false
  "@ibm/plex-mono": false
  "@ibm/plex-sans": false
  "@ibm/plex-sans-arabic": false
  "@ibm/plex-sans-devanagari": false
  "@ibm/plex-sans-hebrew": false
  "@ibm/plex-sans-thai": false
  "@ibm/plex-sans-thai-looped": false
  "@ibm/plex-serif": false
  "@ibm/telemetry-js": false
strictDepBuilds: true
# The precompiled @carbon/styles CSS is used: no Sass.
peerDependencyRules:
  ignoreMissing:
    - sass
