name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove passwords, API keys, personal data and document contents from logs and screenshots before posting.
        Security problems: please use the private vulnerability report (link on the previous page) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
      placeholder: |
        1. Uploaded a scanned PDF …
        2. Searched for …
        Expected: …
        Actual: …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `./pgo --version`, or the git commit (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Docker version, browser (if it matters).
      placeholder: macOS 26 on Apple Silicon, Docker 29.4, Safari 26
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs web --tail 100` or the command output. Pasted as code."
      render: text
