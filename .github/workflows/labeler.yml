name: Label pull requests

# pull_request_target runs with the base branch's workflow and a token that can
# write labels, also for Dependabot PRs. It is safe here because the PR's code
# is never checked out or executed; the labeler only reads the changed paths.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
