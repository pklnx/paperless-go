name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request run cancels the older run of the same pull request (its group
# is the PR ref). A push to main gets a group of its own per commit and is never
# cancelled, so every merge gets a complete CI result, also when the next merge
# follows seconds later.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Docker Hub images: CI pulls them through mirror.gcr.io (Google's public
# Docker Hub cache), with Docker Hub as the fallback, so a Docker Hub error or
# rate limit does not fail a job (option (b) of #151; no secrets, the same for
# fork and Dependabot pull requests). dockerd gets the mirror from
# scripts/ci-docker-mirror.sh, the buildx builders from buildkitd-config-inline,
# and the test job's service names the mirror directly. The script also drops
# the runner's Docker Hub login for the job's later steps, because dockerd
# would send it to the mirror, which refuses it: pulls are anonymous. Users' builds (the
# Dockerfile, docker-compose.yml, ./pgo, release.yml) do not use it.
#
# Timeouts are about 2-3 times the longest run seen (2026-10-21 to 2026-10-23).

jobs:
  test:
    runs-on: ubuntu-latest
    # The slowest passing run took 17 min on a slow runner.
    timeout-minutes: 25
    services:
      postgres:
        # The image and locale of docker-compose.yml. The runner pulls service
        # images before any step, so no daemon mirror config applies here: the
        # image is named on mirror.gcr.io directly, without a Docker Hub
        # fallback (the runner retries a failed pull itself). postgres:18 is a
        # heavily used tag and always cached there, though the mirror may serve
        # the previous patch release for a short time after a new one. Should
        # the mirror ever fail this job, start PostgreSQL with `docker run` in a
        # step after scripts/ci-docker-mirror.sh instead.
        image: mirror.gcr.io/library/postgres:18
        env:
          POSTGRES_USER: paperless
          POSTGRES_PASSWORD: paperless
          POSTGRES_DB: paperless
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8
        # Random host port on loopback; the test step reads it below.
        ports: ["127.0.0.1::5432"]
        options: >-
          --health-cmd "pg_isready -U paperless"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      # The load test (scripts/loadtest) builds only with its tag: keep it
      # compiling and its report logic tested.
      - run: go vet -tags loadtest ./scripts/loadtest/...
      # Random test order (-shuffle=on): a failure prints its seed as
      # -test.shuffle N; rerun it with go test -shuffle=N.
      - run: go test -tags loadtest -shuffle=on -count=1 ./scripts/loadtest/...
      - run: go test -race -shuffle=on -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://paperless:paperless@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/paperless?sslmode=disable

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      # Generated database code must match internal/store/queries.
      - run: make sqlc-check
      # The Dockerfile's Go version guard must pass and fail where it should.
      - run: sh scripts/check-go-toolchain-test.sh

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # govulncheck version is pinned in the Makefile and verified through
      # the Go checksum database.
      - run: make vuln

  docker:
    runs-on: ubuntu-latest
    # Up to 10 min with a cold layer cache.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "PROOF (temporary): block mirror.gcr.io"
        run: |
          echo "0.0.0.0 mirror.gcr.io" | sudo tee -a /etc/hosts
          # A pull from the mirror must fail now.
          if docker pull --quiet mirror.gcr.io/library/busybox:1.37; then echo "mirror block is not effective" >&2; exit 1; fi
          echo "mirror.gcr.io is blocked"
      - run: scripts/ci-docker-mirror.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # PROOF (temporary): the builder container shares the host's /etc/hosts.
          driver-opts: network=host
          # BuildKit in the builder container pulls the Dockerfile's images
          # (and its # syntax frontend) through the mirror, falling back to
          # Docker Hub when the mirror fails or lacks a tag.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build amd64 and arm64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          # Layer cache in the GitHub Actions cache: the apt layer is rebuilt when
          # its packages or the base image digest (Dependabot) change.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  toolstest:
    # Tests of internal/process with the real OCR tools, in the toolstest
    # stage of the Dockerfile (the runtime packages), as UID 65532.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "PROOF (temporary): block mirror.gcr.io"
        run: |
          echo "0.0.0.0 mirror.gcr.io" | sudo tee -a /etc/hosts
          # A pull from the mirror must fail now.
          if docker pull --quiet mirror.gcr.io/library/busybox:1.37; then echo "mirror block is not effective" >&2; exit 1; fi
          echo "mirror.gcr.io is blocked"
      - run: scripts/ci-docker-mirror.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # PROOF (temporary): the builder container shares the host's /etc/hosts.
          driver-opts: network=host
          # BuildKit in the builder container pulls the Dockerfile's images
          # (and its # syntax frontend) through the mirror, falling back to
          # Docker Hub when the mirror fails or lacks a tag.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build the toolstest stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: toolstest
          load: true
          tags: paperless-go:toolstest
          push: false
          cache-from: type=gha
      - run: docker run --rm --user 65532:65532 --network none paperless-go:toolstest

  compose:
    # End-to-end test of docker-compose.yml, the image and the ./pgo wrapper.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "PROOF (temporary): block mirror.gcr.io"
        run: |
          echo "0.0.0.0 mirror.gcr.io" | sudo tee -a /etc/hosts
          # A pull from the mirror must fail now.
          if docker pull --quiet mirror.gcr.io/library/busybox:1.37; then echo "mirror block is not effective" >&2; exit 1; fi
          echo "mirror.gcr.io is blocked"
      - run: scripts/ci-docker-mirror.sh
      # The base images and postgres:18 with retries; the smoke test's build
      # then takes them from the local store.
      - run: scripts/ci-pull-images.sh
      - run: scripts/compose-smoke-test.sh
      # The release bundle, with the image the run above built: its
      # docker-compose.yml must work without the source and without a build.
      - name: Release bundle
        run: |
          scripts/release-bundle.sh 99.01-1 "$RUNNER_TEMP/dist"
          # No entry may carry the runner's UID.
          tar -tvzf "$RUNNER_TEMP/dist/paperless-go.tar.gz" | awk '$2 != "0/0" { print; bad = 1 } END { exit bad }'
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/dist/paperless-go.tar.gz"
          SMOKE_DIR="$RUNNER_TEMP/paperless-go" PAPERLESS_GO_IMAGE=paperless-go:smoke scripts/compose-smoke-test.sh
      - name: Release version numbers
        run: |
          set -eu
          git init -q "$RUNNER_TEMP/tags" && cd "$RUNNER_TEMP/tags"
          git -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m tags
          check() { got=$("$GITHUB_WORKSPACE/scripts/next-version.sh" "$1"); [ "$got" = "$2" ] || { echo "$1: got $got, want $2"; exit 1; }; }
          check 26.10 26.10-1
          git tag v26.10-1 && git tag v26.10-3 && git tag v26.09-7 && git tag v26.10-rc
          check 26.10 26.10-4
          check 26.11 26.11-1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node 25+ no longer bundles corepack; keep the version in sync with the Dockerfile.
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The built output has no eval( or new Function( (the CSP has no
      # 'unsafe-eval'); a missing or incomplete build fails too.
      - run: pnpm check:dist

  audit:
    # pnpm audit of the UI's production dependencies. Not a required check:
    # it asks the npm registry, which can time out, and Dependabot covers the
    # same advisories. A finding still turns it red. It audits the lockfile,
    # so it needs no install.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node 25+ no longer bundles corepack; keep the version in sync with the Dockerfile.
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: pnpm audit --prod
