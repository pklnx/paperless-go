name: Secrets

# Scans the commits each pull request adds and every push to main for
# committed credentials with gitleaks (version pinned in the Makefile).
# There is deliberately no `paths` or `paths-ignore` filter: secret-scan is a
# required check, so it must run on every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Separate from ci.yml so its cancel-in-progress cannot drop a scan. Pull
# requests share a group per ref and cancel older runs (the next run scans the
# whole PR again). Each push to main gets its own group, keyed by its SHA, so
# no push is cancelled or replaced while queued and none goes unscanned.
concurrency:
  group: secrets-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Builds the pinned gitleaks (verified through the Go checksum database)
      # and checks that the scan fails and passes where it should.
      - run: make secrets-test
      # --redact keeps secret values out of the job log.
      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          SECRETS_LOG_OPTS=$(sh scripts/secret-scan-range.sh)
          export SECRETS_LOG_OPTS
          echo "Scanning: git log $SECRETS_LOG_OPTS"
          make secrets
