name: Docs

# Builds the documentation site (docs/, VitePress) and publishes it to GitHub
# Pages on pushes to main. Pull requests only build it, which catches broken
# links. Pages must be set to "GitHub Actions" in Settings → Pages.

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Pull request runs cancel the older run of the same pull request. On main a
# run never cancels a running one: runs queue in push order, so the last deploy
# is always the newest commit (a group per commit would let builds finish out of
# order and an older site end up live). GitHub keeps one pending run per group,
# so with three or more pushes during one run the pending middle run is
# replaced; the newest run publishes the whole site, so nothing is lost. The
# docs-audit job belongs to the run too: a hanging npm registry holds the group
# up to its 10-minute timeout and delays the next deploy by that much.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # "last updated" dates come from git history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node 25+ no longer bundles corepack; keep the version in sync with the Dockerfile.
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  docs-audit:
    # pnpm audit of the docs site's dependencies. Not a required check, and
    # deploy does not wait for it: it asks the npm registry, which can time
    # out, and Dependabot covers the same advisories. A finding still turns it
    # red. It audits the lockfile, so it needs no install. Named docs-audit so
    # it is not confused with CI's audit check.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node 25+ no longer bundles corepack; keep the version in sync with the Dockerfile.
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: pnpm audit

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
